name: Deploy to k3s

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-portafolio
  cancel-in-progress: false

jobs:
  deploy:
    # In-cluster self-hosted runner (see k8s/ci/runner-deployment.yaml).
    # The runner pod has the k3s containerd socket mounted, so it can
    # build the image and import it directly into the kubelet's image
    # cache without needing a registry.
    runs-on: [self-hosted, linux, portafolio]
    timeout-minutes: 30
    env:
      # Each build is tagged with the commit SHA so kubelet never has to
      # guess which copy of `:latest` to use. The deployment manifest is
      # patched per-deploy to reference this exact tag, eliminating the
      # whole class of "kubelet picks up a stale phantom image" bugs.
      IMAGE_REPO: portafolio-2026
      TAR: /tmp/portafolio-2026.tar
      APP_NS: portafolio
      APP: portafolio
      CONTAINERD_SOCK: /run/k3s/containerd/containerd.sock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl + ctr + buildah
        run: |
          set -e
          if ! command -v kubectl >/dev/null; then
            KUBE_VER=$(curl -sL https://dl.k8s.io/release/stable.txt)
            curl -sLo /tmp/kubectl "https://dl.k8s.io/release/${KUBE_VER}/bin/linux/amd64/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          if ! command -v ctr >/dev/null; then
            CONTAINERD_VER=1.7.22
            curl -sL "https://github.com/containerd/containerd/releases/download/v${CONTAINERD_VER}/containerd-${CONTAINERD_VER}-linux-amd64.tar.gz" -o /tmp/containerd.tgz
            sudo tar -xzf /tmp/containerd.tgz -C /usr/local bin/ctr
            rm -f /tmp/containerd.tgz
          fi
          if ! command -v buildah >/dev/null || ! command -v fuse-overlayfs >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq buildah fuse-overlayfs uidmap
          fi

      - name: Configure kubectl
        # The runner can be either:
        #   (a) an in-cluster pod with a mounted ServiceAccount token at
        #       /var/run/secrets/kubernetes.io/serviceaccount/, or
        #   (b) a host-installed runner whose user already has a kubeconfig
        #       (~/.kube/config, KUBECONFIG, or /etc/rancher/k3s/k3s.yaml).
        # We only synthesise an in-cluster kubeconfig when (a) is true AND
        # there is no existing kubeconfig — otherwise we'd clobber a working
        # one. Done early so the import step (which copies the tar into a
        # runner pod via kubectl) has cluster access.
        run: |
          set -e
          SA_TOKEN=/var/run/secrets/kubernetes.io/serviceaccount/token
          if [ -f "$SA_TOKEN" ] && [ -z "${KUBECONFIG:-}" ] && [ ! -f "$HOME/.kube/config" ]; then
            echo "In-cluster runner — configuring kubectl from ServiceAccount"
            SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
            kubectl config set-cluster in-cluster \
              --server=https://kubernetes.default.svc \
              --certificate-authority="$SA_DIR/ca.crt" \
              --embed-certs=true
            kubectl config set-credentials sa --token="$(cat "$SA_TOKEN")"
            kubectl config set-context in-cluster \
              --cluster=in-cluster --user=sa --namespace="${APP_NS}"
            kubectl config use-context in-cluster
          else
            echo "Host runner — using existing kubeconfig"
            if [ -z "${KUBECONFIG:-}" ] && [ ! -f "$HOME/.kube/config" ] && [ -r /etc/rancher/k3s/k3s.yaml ]; then
              echo "KUBECONFIG=/etc/rancher/k3s/k3s.yaml" >> "$GITHUB_ENV"
              export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            fi
          fi
          kubectl get ns "${APP_NS}" >/dev/null
          echo "kubectl OK — context: $(kubectl config current-context 2>/dev/null || echo n/a)"

      - name: Configure buildah unqualified-search registries
        # Buildah doesn't ship with docker.io as a default unqualified search
        # registry — short-names like `oven/bun:1-alpine` fail with "did not
        # resolve to an alias". Drop a minimal registries.conf if missing so
        # short-names from any Dockerfile resolve to docker.io.
        run: |
          set -e
          sudo mkdir -p /etc/containers
          if ! grep -q '^unqualified-search-registries' /etc/containers/registries.conf 2>/dev/null; then
            echo 'unqualified-search-registries = ["docker.io"]' | sudo tee -a /etc/containers/registries.conf > /dev/null
          fi

      - name: Compute version components
        # nuxt.config.ts formats these into:
        #   <env>-v<pkg.version>-<DD-MM-YYYY>-build:<sha>
        # `main` / `master` map to "production"; everything else stays as the
        # branch name (sanitised so feature/* slashes don't poison the string).
        # The vN segment comes from package.json — bump it when you ship a
        # release; the date and SHA refresh every build.
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH=$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')
          if [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            APP_ENV="production"
          else
            APP_ENV="${BRANCH}"
          fi
          PKG_VERSION=$(jq -r .version package.json)
          # Image is tagged with the commit SHA so kubelet always pulls a
          # specific bundle on each deploy. No more :latest ambiguity.
          IMAGE="${IMAGE_REPO}:${SHORT_SHA}"
          {
            echo "APP_ENV=${APP_ENV}"
            echo "APP_COMMIT=${SHORT_SHA}"
            echo "IMAGE=${IMAGE}"
          } >> "$GITHUB_ENV"
          echo "Build will report: ${APP_ENV}-v${PKG_VERSION}-<today>-build:${SHORT_SHA}"
          echo "Image tag: ${IMAGE}"

      - name: Build image with buildah
        # Runner runs on overlayfs; default overlay driver can't stack.
        # Try fuse-overlayfs first; fall back to vfs (slower, universal).
        run: |
          set -e
          BUILD_ARGS=(
            --build-arg "APP_ENV=${APP_ENV}"
            --build-arg "APP_COMMIT=${APP_COMMIT}"
          )
          STORAGE_OPTS=(--storage-driver overlay --storage-opt overlay.mount_program=/usr/bin/fuse-overlayfs)
          if ! sudo buildah "${STORAGE_OPTS[@]}" bud --isolation chroot "${BUILD_ARGS[@]}" -t "${IMAGE}" . ; then
            echo "fuse-overlayfs build failed; retrying with vfs driver"
            sudo rm -rf /var/lib/containers/storage /root/.local/share/containers || true
            STORAGE_OPTS=(--storage-driver vfs)
            sudo buildah "${STORAGE_OPTS[@]}" bud --isolation chroot "${BUILD_ARGS[@]}" -t "${IMAGE}" .
          fi
          sudo buildah "${STORAGE_OPTS[@]}" push "${IMAGE}" "docker-archive:${TAR}:${IMAGE}"
          sudo chmod a+r "${TAR}"

      - name: Import image onto the worker node
        # The runner host has its own containerd, but pods are pinned to
        # `nodepool: dev` (vmi1774467). Importing into the host's containerd
        # leaves kubelet on the worker with no copy of the image — and with
        # `imagePullPolicy: Never` that's an ErrImageNeverPull rollout
        # deadlock. We piggy-back on a github-runner pod that already runs
        # on the dev worker (in violet-vault or reedley-hay namespaces) so
        # the image lands in the right node's containerd.
        run: |
          set -e
          for ns in "${APP_NS}" violet-vault reedley-hay; do
            POD=$(kubectl get pod -n "$ns" -l app=github-runner \
              -o jsonpath='{.items[?(@.status.phase=="Running")].metadata.name}' 2>/dev/null \
              | awk '{print $1}')
            if [ -n "${POD:-}" ]; then RUNNER_NS="$ns"; RUNNER_POD="$POD"; break; fi
          done
          if [ -z "${RUNNER_POD:-}" ]; then
            echo "::error::No github-runner pod found in any namespace"; exit 1
          fi
          echo "Importing via $RUNNER_NS/$RUNNER_POD"
          kubectl cp "${TAR}" "$RUNNER_NS/$RUNNER_POD:/tmp/portafolio-2026.tar"
          kubectl exec -n "$RUNNER_NS" "$RUNNER_POD" -- \
            ctr --address "${CONTAINERD_SOCK}" -n k8s.io images import /tmp/portafolio-2026.tar
          kubectl exec -n "$RUNNER_NS" "$RUNNER_POD" -- rm -f /tmp/portafolio-2026.tar
          rm -f "${TAR}"

      - name: Remove legacy svc/ingress (one-time cleanup, idempotent)
        # The pre-existing port-3001 deployment shipped a `portafolio-svc`
        # service and `portafolio-ing` ingress. Both names differ from the new
        # manifests (`portafolio` for both), so apply alone won't replace
        # them. Delete-if-present keeps the namespace clean.
        run: |
          kubectl delete service portafolio-svc -n "${APP_NS}" --ignore-not-found
          kubectl delete ingress portafolio-ing -n "${APP_NS}" --ignore-not-found

      - name: Apply manifests
        # namespace.yaml + secret.yaml + k8s/ci/* are bootstrapped out-of-band
        # (cluster-scoped or carry secrets that don't belong in git).
        # Service/ingress only reference label selectors, so they're stable.
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Apply deployment with build-specific image tag
        # The committed deployment.yaml ships with `image: portafolio-2026:latest`
        # so manual deploys still work. CI substitutes the latest tag with the
        # commit-SHA tag before applying, so kubelet never resolves `:latest`
        # against a stale phantom in containerd. Single-shot apply — no race
        # window where the old tag could briefly be in spec.
        run: |
          sed "s|portafolio-2026:latest|${IMAGE}|g" k8s/deployment.yaml \
            | kubectl apply -f -
          kubectl rollout status deployment/"${APP}" -n "${APP_NS}" --timeout=180s

      - name: Smoke-test /api/v1/health
        run: |
          POD=$(kubectl get pod -n "${APP_NS}" -l "app=${APP}" -o jsonpath='{.items[0].metadata.name}')
          # Image is oven/bun (no curl/wget) - use bun's built-in fetch.
          kubectl exec -n "${APP_NS}" "$POD" -- bun -e \
            'fetch("http://127.0.0.1:3000/api/v1/health").then(r=>r.text()).then(t=>{console.log(t); if(!t.includes("healthy")) process.exit(1);})'
