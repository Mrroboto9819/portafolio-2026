# Bootstrap secret for the in-cluster GitHub Actions runner.
#
# Generate a Personal Access Token (classic) with `repo` scope, then create
# the actual secret with kubectl (do NOT commit a populated copy):
#
#   kubectl create secret generic github-runner-token \
#     -n portafolio \
#     --from-literal=GITHUB_TOKEN=ghp_xxxxxxxxxxxxxxxxxxxx
#
# This file exists only to document the shape; it is intentionally a template.
apiVersion: v1
kind: Secret
metadata:
  name: github-runner-token
  namespace: portafolio
type: Opaque
stringData:
  GITHUB_TOKEN: ghp_REPLACE_WITH_PAT
