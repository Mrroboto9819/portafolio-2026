apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  namespace: portafolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      serviceAccountName: github-runner-sa
      nodeSelector:
        nodepool: dev
      containers:
        - name: runner
          image: myoung34/github-runner:2.332.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REPO_URL
              # Update this to the actual GitHub repo URL.
              value: https://github.com/Mrroboto9819/portafolio-2026
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-runner-token
                  key: GITHUB_TOKEN
            - name: RUNNER_NAME
              value: portafolio-2026
            - name: RUNNER_WORKDIR
              value: /tmp/runner/work
            - name: LABELS
              value: self-hosted,linux,portafolio
            - name: RUNNER_SCOPE
              value: repo
            - name: DISABLE_AUTO_UPDATE
              value: "true"
          securityContext:
            # Required so the runner can mount the host containerd socket
            # and run buildah for image builds.
            privileged: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: containerd-sock
              mountPath: /run/k3s/containerd/containerd.sock
            - name: runner-work
              mountPath: /tmp/runner/work
      volumes:
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
            type: Socket
        - name: runner-work
          emptyDir:
            sizeLimit: 10Gi
