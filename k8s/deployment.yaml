apiVersion: apps/v1
kind: Deployment
metadata:
  name: portafolio
  namespace: portafolio
spec:
  replicas: 1
  # Recreate (vs. RollingUpdate) avoids the failure mode where a broken old
  # ReplicaSet keeps a pod alive in ErrImageNeverPull while the new RS waits
  # for it to terminate — the deploy deadlocks for 3 minutes and times out.
  # We don't need rolling for a single-replica personal site; a few seconds
  # of downtime per deploy is fine.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portafolio
  template:
    metadata:
      labels:
        app: portafolio
    spec:
      nodeSelector:
        nodepool: dev
      containers:
        - name: web
          image: portafolio-2026:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: portafolio-env
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
