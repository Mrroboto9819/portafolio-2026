apiVersion: v1
kind: Secret
metadata:
  name: portafolio-env
  namespace: portafolio
type: Opaque
stringData:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"

  # Mongo — reuses the in-cluster MongoDB. The portafolio_user / database
  # must be created out-of-band before first deploy:
  #   use portafolio
  #   db.createUser({ user: "portafolio_user", pwd: "<pw>",
  #                   roles: [{ role: "readWrite", db: "portafolio" }] })
  MONGODB_URI: "mongodb://portafolio_pcc_admin:CHANGE_ME@mongodb-0.mongodb-headless.mongodb.svc.cluster.local:27017/portafolio?directConnection=true&authSource=portafolio"
  MONGODB_DB: "portafolio"

  # First-admin bootstrap. The `users` collection is the source of truth —
  # there is intentionally no ADMIN_PASSWORD env var. POST once to
  # /api/v1/auth/setup with this token (Authorization: Bearer <token>) to
  # create the first admin; the endpoint refuses once any admin exists.
  # Generate with `openssl rand -hex 32`. Safe to remove from this secret
  # after first-run setup.
  SETUP_TOKEN: "CHANGE_ME_setup_token_used_once_to_create_first_admin"

  # JWT secrets — rotate these and any active session is invalidated.
  # Both must be >= 32 chars of entropy. Generate with `openssl rand -hex 48`.
  JWT_ACCESS_SECRET: "CHANGE_ME_access_secret_at_least_48_hex_chars_of_entropy"
  JWT_REFRESH_SECRET: "CHANGE_ME_refresh_secret_at_least_48_hex_chars_of_entropy"

  # Token TTLs (seconds). Access = short-lived bearer; refresh = httpOnly cookie.
  JWT_ACCESS_TTL_SECONDS: "600"     # 10 min
  JWT_REFRESH_TTL_SECONDS: "10800"  # 3 h

  # Admin rate-limit knobs (already used by server/utils/rateLimit.ts)
  ADMIN_LOGIN_MAX_ATTEMPTS: "10"
  ADMIN_INFO_MAX_REQUESTS: "120"
  ADMIN_RATE_LIMIT_WINDOW_SECONDS: "900"
  ADMIN_RESTART_MAX_REQUESTS: "5"
